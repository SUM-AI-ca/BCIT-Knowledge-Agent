[project]
name = "bcit-rag-chatbot"
version = "5.0.0"
# Moved off 3.10 in August 2026: google.api_core warns that it stops shipping
# updates for 3.10 after its EOL on 2026-10-04. The floor is 3.12 rather than
# 3.13 so the VM's system interpreter stays a valid fallback; the venvs (local
# and production) are built on 3.13 by uv.
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "langchain==1.3.14",
    "langchain-community==0.4.2",
    "langchain-core==1.5.3",
    "langgraph==1.2.10",
    # Chat: ChatGoogleGenerativeAI(vertexai=True). langchain-google-vertexai is
    # kept for VertexAIEmbeddings only (its ChatVertexAI is deprecated since
    # 3.2.0 and removed in 4.0.0; the embeddings class is unaffected).
    "langchain-google-genai==4.3.3",
    "langchain-google-vertexai==3.2.4",
    "google-cloud-discoveryengine==0.20.2",
    "langchain-postgres==0.0.17",
    "psycopg[binary]>=3.2,<4",
    "rank-bm25==0.2.2",
    "numpy==2.2.6",
    "tqdm==4.70.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[tool.uv]
index-url = "https://pypi.org/simple"
